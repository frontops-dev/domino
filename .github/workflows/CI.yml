name: CI
env:
  DEBUG: napi:*
  APP_NAME: domino
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
'on':
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
concurrency:
  # Pull request runs are superseded by newer pushes to the same branch, but each
  # commit on main gets its own group so it is never cancelled or queued: pushes to
  # main publish release artifacts and must always run the full matrix.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Install Rust toolchain
        run: rustup show
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Oxlint
        run: yarn lint
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy
      - name: Test publish-preview script
        run: node --test tests/publish-preview.test.js
      - name: Test version sync script
        run: node --test tests/sync-version.test.js
      - name: Test release re-run script
        run: node --test tests/release-rerun.test.js
      - name: Test npm propagation wait script
        run: node --test tests/wait-for-npm.test.js
      - name: Test binary version check script
        run: node --test tests/check-binary-version.test.js
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # No step here needs to authenticate to the remote; don't leave the
          # job-scoped token in the local git config while running repo code.
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: test-cargo-${{ runner.os }}-
      # --no-default-features skips the napi-bindings feature: N-API symbols
      # only resolve inside a Node process, so test binaries can't link with it
      - name: Run unit tests
        run: cargo test --lib --no-default-features
      - name: Run integration tests
        run: cargo test --no-default-features --test integration_test -- --test-threads=1
      - name: Run CLI tests
        run: cargo test --no-default-features --test cli_test -- --test-threads=1
  verify-pr-title:
    name: Verify PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional commit format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TITLE="$PR_TITLE"
          PATTERN="^(feat|fix|chore|ci|docs|refactor|test|perf|build|style|revert)(\(.+\))?(!)?: .+"

          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title must follow conventional commits format."
            echo ""
            echo "Expected: <type>(<optional scope>): <description>"
            echo "Got:      $TITLE"
            echo ""
            echo "Allowed types: feat, fix, chore, ci, docs, refactor, test, perf, build, style, revert"
            echo "Examples:"
            echo "  feat: add new parser"
            echo "  fix(resolver): handle circular imports"
            echo "  feat!: redesign API"
            exit 1
          fi

          echo "PR title is valid: $TITLE"
  release-version:
    name: Release version
    # Decides the release version before anything is compiled. The version is built
    # into the binaries (`CARGO_PKG_VERSION`: --version, the JSON output and report
    # headers), so building first and bumping in publish shipped every release with
    # the previous release's version. This job always runs, since build needs it;
    # release=false means nothing will be published: a pull request, `[skip release]`,
    # a version commit or a superseded re-run.
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      next_version: ${{ steps.version.outputs.next_version }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Determine version bump
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Not a push to main, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `[skip release]` anywhere in the pushed commit's message skips publishing but
          # still runs the full build and test matrix. The next unmarked push releases the
          # skipped commits too: the bump reads every commit subject since the last tag.
          if [[ "$HEAD_COMMIT_MESSAGE" == *"[skip release]"* ]]; then
            echo "[skip release] in the commit message, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --force --tags origin main

          COMMIT_MSG=$(git log -1 --pretty=%s)

          if echo "$COMMIT_MSG" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"; then
            echo "Current commit is a version commit, skipping bump"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A release tag already on HEAD means this is a re-run of that release (for
          # example after the version commit failed). Reuse its version: bumping from
          # it would publish a duplicate. The publish job's claim re-pushes the same tag,
          # npm publish skips what is already there, and the version commit gets another
          # try. If a
          # newer release has shipped since — or, with no tag on HEAD, the newest release
          # is not an ancestor of HEAD — publishing would move `latest` backwards, so the
          # release is skipped instead, without failing, since nothing is wrong.
          RERUN=$(node scripts/release-rerun.js)
          read -r RERUN_ACTION RERUN_VERSION NEWEST_VERSION <<< "$RERUN"
          # Anything but the three known actions (empty output included) stops the
          # step: falling through to a normal bump could publish a duplicate release.
          case "$RERUN_ACTION" in
            superseded)
              if [ "$RERUN_VERSION" = "-" ]; then
                echo "::notice::HEAD is behind v${NEWEST_VERSION}, which is not an ancestor — skipping release"
              else
                echo "::notice::v${RERUN_VERSION} on HEAD is superseded by v${NEWEST_VERSION} — skipping release"
              fi
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "bump=none" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            reuse)
              echo "HEAD is already released as v${RERUN_VERSION}; re-running that release"
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "bump=rerun" >> "$GITHUB_OUTPUT"
              echo "next_version=${RERUN_VERSION}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            none) ;;
            *)
              echo "::error::unexpected release-rerun output: $RERUN"
              exit 1
              ;;
          esac

          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 --match "[0-9]*" 2>/dev/null || echo "")
          fi

          if [ -z "$LAST_TAG" ]; then
            echo "No previous tags found, using all commits"
            SUBJECTS=$(git log --format="%s" --no-merges)
            BODIES=$(git log --format="%b" --no-merges)
          else
            echo "Last tag: $LAST_TAG"
            SUBJECTS=$(git log "${LAST_TAG}..HEAD" --format="%s" --no-merges)
            BODIES=$(git log "${LAST_TAG}..HEAD" --format="%b" --no-merges)
          fi

          echo "=== Commits since last tag ==="
          echo "$SUBJECTS"
          echo "=== End commits ==="

          BUMP="patch"
          BUMP_REASON="default (no feat: or breaking changes detected)"

          if echo "$SUBJECTS" | grep -qE "^[a-z]+(\(.+\))?!:"; then
            BUMP="major"
            BREAKING_SUBJECT=$(echo "$SUBJECTS" | grep -E "^[a-z]+(\(.+\))?!:" | head -1)
            BUMP_REASON="breaking change in commit subject: ${BREAKING_SUBJECT}"
          elif echo "$BODIES" | grep -qE "^BREAKING[ -]CHANGE:"; then
            BUMP="major"
            BUMP_REASON="BREAKING CHANGE footer found in commit body"
          elif echo "$SUBJECTS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
            BUMP_REASON="feat: commit detected"
          fi

          echo ""
          echo "##################################################"
          echo "# Version bump: $BUMP"
          echo "# Reason: $BUMP_REASON"
          echo "##################################################"

          if [ "$BUMP" = "major" ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            NEXT_MAJOR=$((${CURRENT_VERSION%%.*} + 1)).0.0
            echo ""
            echo "::warning::MAJOR version bump detected: ${CURRENT_VERSION} → ${NEXT_MAJOR}"
            echo "::warning::Triggered by: ${BUMP_REASON}"
            echo "::warning::If this is unintentional, check commit messages for accidental '!:' suffix or 'BREAKING CHANGE:' footer"
          fi

          # Bump from the last tag rather than from package.json: a queued run's checkout
          # can still carry the pre-bump version even though a release already happened.
          BASE_VERSION="${LAST_TAG#v}"
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(node -p "require('./package.json').version")
          fi
          NEXT_VERSION=$(node -e 'const [b,t]=process.argv.slice(1);const [x,y,z]=b.split(".").map(Number);console.log(t==="major"?`${x+1}.0.0`:t==="minor"?`${x}.${y+1}.0`:`${x}.${y}.${z+1}`)' "$BASE_VERSION" "$BUMP")

          echo "Next version: $BASE_VERSION -> $NEXT_VERSION"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: yarn build --target x86_64-apple-darwin
          - host: windows-latest
            build: yarn build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: yarn build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: yarn build --target x86_64-unknown-linux-musl -x
          - host: macos-latest
            target: aarch64-apple-darwin
            build: yarn build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: yarn build --target aarch64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: yarn build --target aarch64-unknown-linux-gnu --use-napi-cross
    name: stable - ${{ matrix.settings.target }} - node@22
    needs: release-version
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        if: ${{ !contains(matrix.settings.target, 'linux-gnu') }}
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      # NO cargo cache for Linux GNU - cross builds in Docker with different GLIBC
      # Caching host-compiled dependencies would contaminate cross build with wrong GLIBC version
      # - name: Cache cargo (no target for Linux GNU)
      #   uses: actions/cache@v4
      #   if: ${{ contains(matrix.settings.target, 'linux-gnu') }}
      #   with:
      #     path: |
      #       ~/.cargo/registry/index/
      #       ~/.cargo/registry/cache/
      #       ~/.cargo/git/db/
      #       ~/.napi-rs
      #       .cargo-cache
      #     key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - name: Install cross
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'linux-gnu') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cross
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install cross-compilation dependencies
        if: ${{ contains(matrix.settings.target, 'linux') && matrix.settings.host == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # Before both builds: the addon and the CLI binary each compile the version in.
      - name: Set release version
        if: needs.release-version.outputs.release == 'true'
        run: |
          npm version "${{ needs.release-version.outputs.next_version }}" --no-git-tag-version --ignore-scripts --allow-same-version
          node scripts/sync-version.js
        shell: bash
      - name: Build native addon
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Build binary executable
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
        run: |
          if [[ "${{ matrix.settings.target }}" == *"windows"* ]]; then
            cargo build --release --target ${{ matrix.settings.target }} --bin domino
            BINARY_SOURCE="target/${{ matrix.settings.target }}/release/domino.exe"
            BINARY_DEST="domino-${{ matrix.settings.target }}.exe"
          elif [[ "${{ matrix.settings.target }}" == *"linux-gnu"* ]]; then
            # Use cross to build with older GLIBC version (same approach as oxc)
            # Clean everything to avoid contamination from host-compiled dependencies
            rm -rf target/${{ matrix.settings.target }}
            rm -rf ~/.cargo/registry/cache
            rm -rf ~/.cargo/git/checkouts
            cross build --release --target=${{ matrix.settings.target }} --bin domino
            BINARY_SOURCE="target/${{ matrix.settings.target }}/release/domino"
            BINARY_DEST="domino-${{ matrix.settings.target }}"
            # Verify GLIBC requirement
            echo "Checking GLIBC requirement for binary:"
            objdump -T "$BINARY_SOURCE" | grep GLIBC | sed 's/.*GLIBC_\([.0-9]*\).*/\1/g' | sort -V | tail -1 || echo "No GLIBC symbols found"
          elif [[ "${{ matrix.settings.target }}" == *"musl"* ]]; then
            # Use cargo-zigbuild for musl targets (same approach as oxc)
            cargo zigbuild --release --target=${{ matrix.settings.target }} --bin domino
            BINARY_SOURCE="target/${{ matrix.settings.target }}/release/domino"
            BINARY_DEST="domino-${{ matrix.settings.target }}"
          else
            cargo build --release --target ${{ matrix.settings.target }} --bin domino
            BINARY_SOURCE="target/${{ matrix.settings.target }}/release/domino"
            BINARY_DEST="domino-${{ matrix.settings.target }}"
          fi
          # Copy binary to repo root with target suffix (like oxc: domino-{target} or domino-{target}.exe)
          cp "$BINARY_SOURCE" "$BINARY_DEST"
          echo "BINARY_PATH=$BINARY_DEST" >> $GITHUB_ENV
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
            ${{ env.BINARY_PATH }}
          if-no-files-found: error
  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
        node:
          - '20'
          - '22'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.architecture }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: yarn test
  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
        node:
          - '20'
          - '22'
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Output docker params
        id: docker
        run: |
          node -e "
            if ('${{ matrix.target }}'.startsWith('aarch64')) {
              console.log('PLATFORM=linux/arm64')
            } else if ('${{ matrix.target }}'.startsWith('armv7')) {
              console.log('PLATFORM=linux/arm/v7')
            } else {
              console.log('PLATFORM=linux/amd64')
            }
          " >> $GITHUB_OUTPUT
          node -e "
            if ('${{ matrix.target }}'.endsWith('-musl')) {
              console.log('IMAGE=node:${{ matrix.node }}-alpine')
            } else {
              console.log('IMAGE=node:${{ matrix.node }}-slim')
            }
          " >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: ${{ contains(matrix.target, 'armv7') }}
        with:
          platforms: all
      - run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
        if: ${{ contains(matrix.target, 'armv7') }}
      - name: Test bindings
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ steps.docker.outputs.IMAGE }}
          options: '-v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} --platform ${{ steps.docker.outputs.PLATFORM }}'
          run: |
            # Reinstall dependencies inside container to get correct platform binaries
            # Host installed GNU binaries, but Alpine/musl needs musl binaries
            # This allows Yarn to re-evaluate optionalDependencies for the current platform
            yarn install
            yarn test
  save-pr-metadata:
    name: Save PR metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number and head SHA
        run: |
          echo '{"pr_number": "${{ github.event.pull_request.number }}", "head_sha": "${{ github.event.pull_request.head.sha }}"}' > pr-metadata.json
      - uses: actions/upload-artifact@v5
        with:
          name: pr-metadata
          path: pr-metadata.json
  publish:
    name: Publish
    # The release-version job decides whether and what to release; see there.
    if: github.event_name == 'push' && needs.release-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Main-branch runs are no longer cancelled, so several can be in flight at once.
    # Releases must still happen one at a time: queue publishes instead of overlapping
    # them, since each derives its version from the latest tag.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    needs:
      - release-version
      - lint
      - test
      - test-macOS-windows-binding
      - test-linux-binding
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Confirm release version
        id: version
        env:
          PLANNED_VERSION: ${{ needs.release-version.outputs.next_version }}
        run: |
          # Re-fetch tags: this job is queued behind earlier releases, so one may have
          # shipped since release-version decided the version the binaries were built with.
          git fetch --force --tags origin main
          # Check again here, where releases run one at a time: a newer release may now
          # supersede this commit, and publishing it would move `latest` backwards.
          RERUN=$(node scripts/release-rerun.js)
          read -r RERUN_ACTION RERUN_VERSION NEWEST_VERSION <<< "$RERUN"
          case "$RERUN_ACTION" in
            superseded)
              if [ "$RERUN_VERSION" = "-" ]; then
                echo "::notice::HEAD is behind v${NEWEST_VERSION}, which is not an ancestor — skipping release"
              else
                echo "::notice::v${RERUN_VERSION} on HEAD is superseded by v${NEWEST_VERSION} — skipping release"
              fi
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            reuse)
              if [ "$RERUN_VERSION" != "$PLANNED_VERSION" ]; then
                echo "::error::HEAD was released as v${RERUN_VERSION}, but the binaries were built for v${PLANNED_VERSION}; use \"Re-run all jobs\""
                exit 1
              fi
              ;;
            none) ;;
            *)
              echo "::error::unexpected release-rerun output: $RERUN"
              exit 1
              ;;
          esac
          if [ -z "$PLANNED_VERSION" ]; then
            echo "::error::release-version decided to release but gave no version"
            exit 1
          fi
          echo "Releasing v${PLANNED_VERSION}"
          echo "next_version=${PLANNED_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Bump version
        id: bump
        if: steps.version.outputs.superseded != 'true'
        run: |
          npm version ${{ steps.version.outputs.next_version }} --no-git-tag-version --ignore-scripts --allow-same-version
          node scripts/sync-version.js
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to $NEW_VERSION"
      # Fails closed before the claim, the last reversible step: a binary built with any
      # other version would ship it in --version and every report.
      - name: Check binary version
        if: steps.version.outputs.superseded != 'true'
        run: |
          BINARY=artifacts/bindings-x86_64-unknown-linux-gnu/domino-x86_64-unknown-linux-gnu
          chmod +x "$BINARY"
          node scripts/check-binary-version.js "$BINARY" "${{ steps.bump.outputs.new_version }}"
      - name: Claim version
        id: claim
        if: steps.version.outputs.superseded != 'true'
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          # Compare-and-swap on the tag: creating a remote ref is atomic and reversible,
          # so whoever wins owns the version and everyone else stops here — before npm
          # publish, the only irreversible step. Re-running the same commit re-pushes the
          # same ref, which is a no-op success, so a retry after a flaky publish works.
          # The tag marks the commit that was released; the version commit follows it.
          if git push origin "HEAD:refs/tags/${TAG}"; then
            echo "Claimed ${TAG}"
            echo "claimed=true" >> $GITHUB_OUTPUT
          else
            # The version was decided before this run waited its turn, so a run that
            # released just before it can have taken the same one. Nothing is published
            # wrong: this run's commits wait for the next release. "Re-run all jobs"
            # releases them now; "Re-run failed jobs" would reuse the stale version.
            echo "::warning::${TAG} was claimed by another run, so this commit is not released yet — it goes out with the next release, or now with \"Re-run all jobs\" (not \"Re-run failed jobs\")"
            echo "claimed=false" >> $GITHUB_OUTPUT
          fi
      - name: Generate packages
        if: steps.claim.outputs.claimed == 'true'
        run: node scripts/generate-packages.js
      - name: List packages
        if: steps.claim.outputs.claimed == 'true'
        run: ls -R ./npm
        shell: bash
      - name: Publish to npm
        if: steps.claim.outputs.claimed == 'true'
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Version ${PKG_VERSION} already published, skipping"
            exit 0
          fi
          npm config set provenance true
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push version commit
        if: steps.claim.outputs.claimed == 'true'
        env:
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # generate-packages.js bumps optionalDependencies to the new version — refresh lockfile
          # so CI (yarn install --frozen-lockfile) does not fail on the version commit.
          # Yarn defaults to immutable installs on CI, so allow lockfile updates here.
          # The platform packages just published take a while to appear on the registry
          # (2.0.5 took about 11 minutes, 2.1.0's darwin-arm64 about 7), and yarn install
          # fails until they do. Poll for each one — up to 20 minutes, failing at once on
          # errors that are not propagation — then install. npm view seeing a package does
          # not prove yarn does: the registry CDN caches each Accept variant separately, so
          # the install still gets a few tries.
          INSTALLED=false
          if node scripts/wait-for-npm.js; then
            for i in 1 2 3; do
              if YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install; then
                INSTALLED=true
                break
              fi
              if [ "$i" -lt 3 ]; then
                echo "yarn install attempt $i failed — retrying in 30s"
                sleep 30
              else
                echo "yarn install attempt $i failed — giving up"
              fi
            done
          fi
          if [ "$INSTALLED" != "true" ]; then
            echo "::error::The release is published and tagged; re-run this job to push the version commit"
            exit 1
          fi
          git add package.json Cargo.toml index.js yarn.lock
          git commit -m "${{ steps.bump.outputs.new_version }}"
          # The tag was already pushed to claim the version, so only the commit is left.
          # A feature commit can land on main while we publish, so rebase and retry.
          for i in 1 2 3; do
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            echo "push attempt $i was rejected — rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main || {
              echo "::error::v${{ steps.bump.outputs.new_version }} is published and tagged, but the version commit conflicts with main and must be pushed manually"
              exit 1
            }
          done
          exit 1
